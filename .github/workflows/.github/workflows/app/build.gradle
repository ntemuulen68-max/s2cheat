plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    defaultConfig {
        applicationId "com.ollie.s2cheat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path "../../CMakeLists.txt" }
    }
}

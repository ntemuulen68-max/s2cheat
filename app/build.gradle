plugins { id 'com.android.application' }
android {
    compileSdk 34
    namespace "com.ollie.s2cheat"
    defaultConfig {
        applicationId "com.ollie.s2cheat"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { cppFlags "-std=c++17" }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
}
